<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grational profile</title>

  <style>
    :root {
      --line: #dfe8f5;
      --ink: #172a43;
      --muted: #5f7086;
      --deep: #173d89;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(120deg, #e0e7ee, #ebf3ff 45%, #f5f9ff);
    }

    .wrap { max-width: 1000px; margin: 0 auto; }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 16px 34px rgba(21, 55, 141, .08);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar {
      display: grid;
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #3f7bf0, #214cc2);
      font-size: 1.7rem;
      font-weight: 900;
    }

    h1 { margin: 0; font-size: 2rem; }
    .username { margin: 5px 0 0; color: var(--muted); }
    .bio {
      margin: 22px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f7faff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 16px;
    }

    .video-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d1832;
    }

    .video-title { margin: 0; padding: 14px; }
    .status { color: var(--muted); }
    .home { display: inline-block; margin-bottom: 16px; color: var(--deep); }

    @media (max-width: 650px) {
      .videos { grid-template-columns: 1fr; }
      .card { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
